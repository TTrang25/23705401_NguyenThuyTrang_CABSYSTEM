openapi: 3.0.3
info:
  title: CAB System API
  description: REST API cho hệ thống đặt xe CAB (Công ty ABC)
  version: 1.0.0
servers:
  - url: https://api.cabsystem.abc.vn/v1

tags:
  - name: Auth
  - name: Trips
  - name: Drivers
  - name: Payments
  - name: Ratings
  - name: Notifications
  - name: Admin
  - name: Webhooks

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản (UC01, UC12)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, name, phone, password]
              properties:
                role: { type: string, enum: [customer, driver] }
                name: { type: string, minLength: 1, maxLength: 100 }
                phone: { type: string, pattern: '^0[0-9]{9}$' }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 6, maxLength: 100 }
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Số điện thoại hoặc email đã tồn tại }

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập (UC02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, pattern: '^0[0-9]{9}$' }
                password: { type: string, format: password, minLength: 6, maxLength: 100 }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, user]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  user: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Quá nhiều lần đăng nhập thất bại }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 1 }
      responses:
        '200':
          description: Token mới
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất
      responses:
        '204': { description: Đăng xuất thành công }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me:
    get:
      tags: [Auth]
      summary: Lấy thông tin tài khoản hiện tại
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
    put:
      tags: [Auth]
      summary: Cập nhật thông tin cá nhân (UC03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email, nullable: true }
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/{id}/role:
    put:
      tags: [Admin]
      summary: Gán/đổi vai trò nhân viên (UC31)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [staff_admin, staff_ops, driver, customer] }
      responses:
        '200': { description: Cập nhật vai trò thành công }
        '403': { $ref: '#/components/responses/Forbidden' }

  /trips:
    post:
      tags: [Trips]
      summary: Tạo chuyến đi (UC04, FR01-FR02, AC01-AC03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripCreateRequest' }
      responses:
        '201':
          description: Chuyến đi được tạo, chuyển sang tìm tài xế
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Không thể tạo chuyến do trạng thái tài khoản/chuyến hiện tại }

  /trips/{tripId}:
    get:
      tags: [Trips]
      summary: Xem chi tiết / trạng thái chuyến (UC05, AC04)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips/{tripId}/cancel:
    put:
      tags: [Trips]
      summary: Hủy chuyến đi (UC06)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      responses:
        '200':
          description: Đã hủy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Chuyến đi không thể hủy ở trạng thái hiện tại }

  /trips/{tripId}/tracking:
    get:
      tags: [Trips]
      summary: Vị trí tài xế theo thời gian thực + ETA (UC05, FR08)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [driverLocation, etaSeconds]
                properties:
                  driverLocation: { $ref: '#/components/schemas/GeoPoint' }
                  etaSeconds: { type: integer, minimum: 0 }
        '404': { $ref: '#/components/responses/NotFound' }

  /customers/{id}/trips:
    get:
      tags: [Trips]
      summary: Lịch sử chuyến đi của khách hàng (UC07)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripListResponse' }

  /drivers/{id}:
    get:
      tags: [Drivers]
      summary: Xem hồ sơ tài xế (UC13)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Drivers]
      summary: Cập nhật hồ sơ tài xế (UC13)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverUpdateRequest' }
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /drivers/{id}/vehicles:
    post:
      tags: [Drivers]
      summary: Thêm phương tiện (UC14)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreateRequest' }
      responses:
        '201':
          description: Đã thêm phương tiện
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /vehicles/{vehicleId}:
    put:
      tags: [Drivers]
      summary: Cập nhật thông tin phương tiện (UC14)
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleUpdateRequest' }
      responses:
        '200': { description: Cập nhật thành công }
        '404': { $ref: '#/components/responses/NotFound' }

  /drivers/{id}/availability:
    put:
      tags: [Drivers]
      summary: Bật/tắt trạng thái sẵn sàng nhận chuyến (UC15)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
      responses:
        '200': { description: Cập nhật thành công }

  /drivers/{id}/trip-requests:
    get:
      tags: [Drivers]
      summary: Danh sách chuyến mới được đề xuất (UC16)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Trip' }

  /trips/{tripId}/accept:
    put:
      tags: [Drivers]
      summary: Tài xế chấp nhận chuyến (UC17)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      responses:
        '200': { description: Đã chấp nhận }
        '409': { description: Chuyến đã được tài xế khác nhận hoặc không còn hợp lệ }

  /trips/{tripId}/reject:
    put:
      tags: [Drivers]
      summary: Tài xế từ chối chuyến (UC18, RULE03)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      responses:
        '200': { description: Đã từ chối, hệ thống tự tìm tài xế khác }
        '409': { description: Lời mời đã hết hạn hoặc chuyến không còn hợp lệ }

  /trips/{tripId}/status:
    put:
      tags: [Drivers]
      summary: Cập nhật trạng thái chuyến (UC19, RULE05)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [arrived, picked_up, in_progress, completed]
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '409': { description: Chuyển trạng thái không hợp lệ }

  /drivers/{id}/location:
    put:
      tags: [Drivers]
      summary: Cập nhật vị trí hiện tại (UC20, FR08)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeoPoint' }
      responses:
        '204': { description: Đã cập nhật }
        '400': { $ref: '#/components/responses/BadRequest' }

  /trips/{tripId}/complete:
    post:
      tags: [Drivers]
      summary: Hoàn thành chuyến (UC21)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      responses:
        '200':
          description: Chuyến hoàn thành, chuyển sang tính cước
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '409': { description: Chuyến chưa ở trạng thái có thể hoàn thành }

  /trips/{tripId}/fare:
    get:
      tags: [Payments]
      summary: Xem cước phí (UC08, FR09)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fare' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips/{tripId}/payments:
    post:
      tags: [Payments]
      summary: Thanh toán chuyến đi (UC09, FR10)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [cash, card] }
      responses:
        '201':
          description: Đã tạo giao dịch thanh toán
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409': { description: Chuyến chưa hoàn thành hoặc đã được thanh toán }

  /payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Xem kết quả thanh toán (UC10)
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{paymentId}/retry:
    post:
      tags: [Payments]
      summary: Thử lại thanh toán thất bại (RULE09, FR14)
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Kết quả thử lại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409': { description: Giao dịch không ở trạng thái có thể retry }

  /trips/{tripId}/rating:
    post:
      tags: [Ratings]
      summary: Đánh giá tài xế sau chuyến (UC11)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RatingCreateRequest' }
      responses:
        '201':
          description: Đã ghi nhận đánh giá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rating' }
        '409': { description: Chuyến chưa hoàn thành hoặc đã được đánh giá }

  /drivers/{id}/ratings:
    get:
      tags: [Ratings]
      summary: Xem điểm đánh giá của tài xế
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rating' }

  /notifications:
    get:
      tags: [Notifications]
      summary: Danh sách thông báo của người dùng hiện tại
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }

  /notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Đánh dấu thông báo đã đọc
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Đã đánh dấu }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/customers:
    get:
      tags: [Admin]
      summary: Danh sách khách hàng (UC22)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: OK }

  /admin/drivers:
    get:
      tags: [Admin]
      summary: Danh sách/quản lý tài xế (UC23)
      responses:
        '200': { description: OK }

  /admin/vehicles:
    get:
      tags: [Admin]
      summary: Danh sách/quản lý phương tiện (UC24)
      responses:
        '200': { description: OK }

  /admin/trips:
    get:
      tags: [Admin]
      summary: Danh sách/quản lý chuyến đi (UC25)
      responses:
        '200': { description: OK }

  /admin/trips/active:
    get:
      tags: [Admin]
      summary: Giám sát chuyến đang diễn ra (UC26)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Trip' }

  /admin/drivers/status:
    get:
      tags: [Admin]
      summary: Trạng thái tài xế theo thời gian thực (UC27)
      responses:
        '200': { description: OK }

  /admin/trips/{tripId}/incident:
    post:
      tags: [Admin]
      summary: Ghi nhận & xử lý sự cố chuyến đi (UC28)
      parameters:
        - $ref: '#/components/parameters/TripIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201': { description: Đã ghi nhận sự cố }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/transactions:
    get:
      tags: [Admin]
      summary: Tra cứu giao dịch (UC29)
      responses:
        '200': { description: OK }

  /admin/reports:
    get:
      tags: [Admin]
      summary: Báo cáo thống kê (UC30, BR23)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [totalTrips, revenue, completionRate, cancellationRate]
                properties:
                  totalTrips: { type: integer, minimum: 0 }
                  revenue: { type: number, minimum: 0 }
                  completionRate: { type: number, minimum: 0, maximum: 1 }
                  cancellationRate: { type: number, minimum: 0, maximum: 1 }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Tra cứu nhật ký thao tác (BR26)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLog' }

  /webhooks/payment-provider:
    post:
      tags: [Webhooks]
      summary: Callback kết quả giao dịch từ Payment Provider (FR11, FR13)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerTransactionId, status]
              properties:
                providerTransactionId: { type: string, minLength: 1 }
                status: { type: string, enum: [success, failed] }
      responses:
        '200': { description: Đã nhận }
        '400': { $ref: '#/components/responses/BadRequest' }

  /webhooks/notification-provider:
    post:
      tags: [Webhooks]
      summary: Callback trạng thái gửi từ Notification Provider
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notificationId, status]
              properties:
                notificationId: { type: string, minLength: 1 }
                status: { type: string, enum: [sent, failed] }
      responses:
        '200': { description: Đã nhận }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    TripIdPath:
      name: tripId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Sai thông tin đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Không đủ quyền thực hiện thao tác
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        address: { type: string, maxLength: 500, nullable: true }

    UserAccount:
      type: object
      required: [userId, role, status]
      properties:
        userId: { type: string }
        username: { type: string }
        role: { type: string, enum: [customer, driver, staff_admin, staff_ops] }
        status: { type: string, enum: [active, inactive, locked] }

    Customer:
      type: object
      properties:
        customerId: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true }

    Driver:
      type: object
      properties:
        driverId: { type: string }
        name: { type: string }
        phone: { type: string }
        status: { type: string, enum: [available, busy, offline] }

    DriverUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, pattern: '^0[0-9]{9}$' }

    Vehicle:
      type: object
      properties:
        vehicleId: { type: string }
        plateNumber: { type: string }
        type: { type: string, enum: [standard, premium, bike] }
        driverId: { type: string }

    VehicleCreateRequest:
      type: object
      required: [plateNumber, type]
      properties:
        plateNumber: { type: string, minLength: 1, maxLength: 20 }
